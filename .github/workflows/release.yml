name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Pack
        run: npm pack

      - name: Create GitHub prerelease
        if: ${{ contains(github.ref_name, '-') }}
        run: gh release create "$GITHUB_REF_NAME" ./*.tgz --verify-tag --generate-notes --prerelease
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create GitHub release
        if: ${{ !contains(github.ref_name, '-') }}
        run: gh release create "$GITHUB_REF_NAME" ./*.tgz --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish final release to npm
        if: ${{ !contains(github.ref_name, '-') }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
